<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoibW9zZXN0cnVuZGxlc3RyYWNoYW4iLCJhIjoiY211enZ5aTQ4MDA1NDJ5b3I1bDBlNW5rNSJ9.GztejGQJULxM18icCgEHIw';
      const mymap = new mapboxgl.Map({
             container: 'map',
             style: 'mapbox://styles/mapbox/standard',
             //projection: 'globe', //Display the map as a globe since satellite-v9 defaults to Mercator
             center: [-122.3048, 47.6553], // centering on uw campus
             zoom: 14
          });

      mymap.on('style.load', () => {
         mymap.setConfigProperty('basemap', 'lightPreset', 'dusk'); //setting the light preset to dusk
         mymap.setConfigProperty('basemap', 'showPointOfInterestLabels', true); //showing point of interest labels on the map
         mymap.setConfigProperty('basemap', 'showTransitLabels', true); //showing transit labels on the map
         mymap.setConfigProperty('basemap', 'show3dObjects', true); //showing 3D objects on the map
         mymap.addControl(new mapboxgl.FullscreenControl()); //adding a fullscreen control to the map
         mymap.addControl(new mapboxgl.NavigationControl()); //adding navigation control to the map
      });
   </script>
</body>
</html>
